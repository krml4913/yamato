# yaml-language-server: $schema={{schema}}
# yamato の艦の定義 (dev ひな形)。書式は docs/design.md §5 と README を参照
name: {{name}}
hub: pm                      # captain を務める役割
workspace: "{{workspace}}"   # 席の作業ディレクトリ (作業対象の repo)
charter: charter.md

talk_default: pm            # yamato talk <ship> で席を省いたときに attach する席 (省略時は hub)
# up_seats: [impl]          # yamato up で captain と一緒に起こす席 (既定は空 = captain だけ。up --seats との和)

time_limit: 3h               # yamato up からの稼働時間 (up --for で上書き)
grace: 20m                   # 終業の指示から強制停止までの猶予
# 最終受付 (design-p1 §9): deadline の min(at_most, time_limit × ratio) 前。過ぎたら captain の最初のターンに
# 一度だけ注意を注入し、captain の send の本文の先頭に「(終了まで X 分。片付く範囲で)」を足す (拒否はしない)
# どちらかを off にすればもう一方だけ、`last_call: off` で最終受付なし
last_call:
  at_most: 30m
  ratio: 20%

roles:
  pm:
    model: opus
    shift: persistent
    trust: clean              # merge の権限を持つ席が近くにいる艦なので、割り振りの captain も外部の文章を読まない (§0 B2)
    description: captain。owner の依頼や planner の要件を board の task に分けて席に割り振り、成果を確認して回収する。**自分では実装もレビューも merge もしない**
    remote_control: true     # この席だけ --remote-control を付けて起こす (スマホから話せる席を captain に絞る。design-p1 §1.5)
    inject: [handoff, log_tail, mine, orphans, last_report, board, inbox, memory, knowledge, charter]   # charter: team.yaml の charter のファイル (T-072) / last_report: 前回の日報の「一言」「owner の判断待ち」「明日」 / orphans: 担当が落ちて active のまま残った項目 / board: 艦全体の進み具合 (kanban 風、T-030)
    # persistent の席の入れ替え (design-p1 §5.3, §5.4)。どれも off にできる
    #   止まっている席への send: 下のどれかに当たれば resume せず新しいシフト (記録から起きる)
    #     入れ替えの印 (seat-stop --rotate) / context / idle / new_day
    #   生きている席の Stop hook: context / compaction / hours に当たったら、一度だけ seat-stop --rotate を促す
    rotate:
      context: 30%           # 前のシフトの文脈量がモデルの窓 (下の context_windows) のこの割合以上。300k のようにトークン数でも書ける
                             # 目安: 起動直後の文脈 + 余裕。新しいシフトは最初のターンの終わりで sonnet で 45k 前後あるので、
                             # それより小さいとシフトのたびに入れ替わる (e2e-p1 観測 2)
      compaction: true       # compaction が起きた (PreCompact hook が印を付ける)
      hours: 8h              # シフトの長さ
      idle: 1h               # 止まってからこれ以上たった (resume はキャッシュ切れで高い)
      new_day: true          # 前のシフトの開始から日付が変わった
  impl:
    model: sonnet
    shift: per_task
    count: 1                 # 2 以上にすると席は impl-1, impl-2, ... になる
    description: 実装担当。割り当てられた task を実装してテストし、captain に報告する
  reviewer:
    model: opus
    shift: per_task
    trust: merger             # 外部の文章を読まない + pr merge は分類器なしで通す (下の profiles。auto の分類器が merge を揺れて止めるため)
    description: レビューと merge の担当。実装担当の PR を読み、テストを流し、直すところを返すか、承認して merge する。自分では実装しない
  planner:
    model: opus
    shift: persistent
    remote_control: true     # owner がスマホから話せるように
    inject: [handoff, log_tail, mine, inbox, memory, knowledge, charter]   # 既定の部品 + charter (T-072)
    description: 要件担当。owner と要件・課題・方針を詰め、要件ファイルと board の goal / milestone / task (assignee なし) に落として captain に渡す。実装も割り振りもしない
  # headless の役割の例 (1 シフト = claude -p 1 回。design-p1 §4)。調査や 1 回で終わる確認に向く
  # researcher:
  #   model: sonnet
  #   shift: headless
  #   max_duration: 30m        # 1 シフトの上限 (艦の deadline + grace と早い方で止める)
  #   max_budget_usd: 1.0      # 書いたときだけ --max-budget-usd を付ける (既定は掛けない)
  #   report_to: pm            # シフト終了の定型文の報告先 (省略時は hub)
  #   trust: external          # 下の profiles の名前。外を読む役割の組み方は research のひな形 (design-p1 §7.2) を参照
  #   description: 調査担当

# yamato status / ships で赤く出す目安 (design-p1 §5.2)。生きているのに最後に動いてからこれより長い席
# (ほかに権限の確認待ち・API エラーの席も赤)
watch:
  stale_after: 20m
  # ここからは send / seat-stop / captain の起動時に見る (design-p1 §5.2, §5.5, §5.6)。記録と警告だけで、拒否はしない
  captain_gap: 30m           # captain が止まったまま起きていない時間がこれを超えたら events に captain_gap
  orphan_after: 30m          # active の項目の担当がこれ以上止まっていたら captain の注入に「孤児」と出す
  spin:                      # 空回りの疑い (events に残し、送り手に警告)。spin: off で見ない
    window: 10m
    max_sends: 6             # 同じ送り手 → 宛先が window にこれより多い
    same_text: true          # 同じ本文を続けて送った

# モデル名 (の一部) → 文脈の窓のトークン数 (rotate.context の割合の分母)。長く一致したものを使う。新しいモデルは足す
context_windows:
  haiku: 200000
  sonnet: 1000000
  opus: 1000000

# 無人の席にやらせない操作 (Claude Code の permissions.deny)。艦ごとに自由に変えてよい
# `{{ship}}` は艦フォルダのパスに置き換わる。`ask` ルールは auto モードでも止まるので使わない
deny:
  # git: push は自分のブランチならしてよい (roles/*.md の git の流れ)。force push と履歴の破壊は止める
  - "Bash(git push --force*)"
  - "Bash(git push -f*)"
  - "Bash(git push * --force*)"
  - "Bash(git push * -f*)"
  - "Bash(git push *+*)"      # refspec の + (git push origin +<branch>) も force push
  - "Bash(git reset --hard*)"
  # PR と merge は yamato pr open / pr merge を通す (項目に pr・merged_by が残り、merge が 1 本ずつになる)
  - "Bash(gh pr create*)"
  - "Bash(gh pr merge*)"
  # 作業対象の repo 本体には書かず、yamato worktree add で作った worktree (艦フォルダの worktrees/) で作業する
  # Bash 経由の書き込みまでは止まらないので、役割プロンプトの git の流れと合わせて使う
  # 艦フォルダを workspace の中に置いた艦では、この Edit / Write の行が艦の記録 (handoff.md など) への書き込みも止めるので消す
  - "Edit(/{{workspace}}/**)"
  - "Write(/{{workspace}}/**)"
  # 席の出入りは yamato を通す (自分を止めるのは seat-stop だけ)
  - "Bash(claude stop*)"
  - "Bash(claude rm*)"
  - "Bash(claude --resume*)"
  # 作業 repo の Claude Code 設定
  - "Edit(.claude/**)"
  - "Write(.claude/**)"
  # yamato のコマンドだけが書く記録
  - "Edit(/{{ship}}/team.yaml)"
  - "Write(/{{ship}}/team.yaml)"
  - "Edit(/{{ship}}/roster.json)"
  - "Write(/{{ship}}/roster.json)"
  - "Edit(/{{ship}}/usage.jsonl)"
  - "Write(/{{ship}}/usage.jsonl)"
  - "Edit(/{{ship}}/.runtime/**)"
  - "Write(/{{ship}}/.runtime/**)"
  - "Edit(/{{ship}}/seats/*/inbox.*)"
  - "Write(/{{ship}}/seats/*/inbox.*)"
  - "Edit(/{{ship}}/decisions/**)"
  - "Write(/{{ship}}/decisions/**)"
  # memory 本体は yamato memory apply だけが書く (案の memory.proposed.md・knowledge.proposed.md は直してよい)
  - "Edit(/{{ship}}/roles/*/memory.md)"
  - "Write(/{{ship}}/roles/*/memory.md)"
  - "Edit(/{{ship}}/roles/*/memory-archive.md)"
  - "Write(/{{ship}}/roles/*/memory-archive.md)"
  - "Edit(/{{ship}}/knowledge.md)"
  - "Write(/{{ship}}/knowledge.md)"

# 席の settings.json に重ねる中身 (yamato が要る hooks・auto・受信の設定はその上に載る)
settings:
  worktree:
    bgIsolation: none        # 席は workspace を共有し、自動 worktree を作らない (repo がない艦では yamato が常に none にする)
  remoteControlAtStartup: false   # 席を Remote Control につながない。つなぐ席は roles.<role>.remote_control: true (検証 D V10)

# trust のプロファイル (design-p1 §7.2)。役割の trust: <名前> で選ぶ。書いたものが席の settings と役割の定義に入る
#   mode   permissions.defaultMode (省略時は auto)
#   tools  役割が使えるツールの一覧 (省略時は制限なし)
#   allow / deny  席の settings の permissions に足すルール。{{ship}} / {{yamato}} / {{seat}} が置き換わる
#   send   false にすると、その席からの yamato send を断る
# 開発艦の既定では pm と reviewer (merge に近い席) を clean にする。impl・planner には付けない (付けるかは艦ごと)。
# 外を読む役割を置くなら research のひな形の profiles.external を写す
profiles:
  clean:
    # 外部の文章を読まない。モードは既定の auto (最上位の deny つき)
    deny:
      - "WebFetch"
      - "WebSearch"
  merger:
    # clean (外部の文章を読まない) + yamato pr merge だけは分類器なしで通す (reviewer。auto の分類器が
    # 「レビューなしの merge」として揺れて止めるので、merge を打つ役の allow に足す)
    deny:
      - "WebFetch"
      - "WebSearch"
    allow:
      - "Bash({{yamato}} pr merge*)"

# seat-stop が終業前に確かめること
seat_stop:
  require_handoff: true      # handoff.md が今回のシフトで更新されていること
  require_delivery: true     # 生きている宛先への送信が読まれているか、--delivered が付いていること

# SessionStart で席に読ませるもの (design §8.2)。役割ごとに roles.<role>.inject で上書きできる
# 注入は hook 2 本 (記録: handoff・作業ログ・担当・日報・inbox など / 知見: 役割の memory と knowledge.md) に分かれ、
# それぞれ total_chars まで。上限を超えた分は切って「全文は <パス> を Read せよ」と書く。memory と knowledge は下の memory.limits で切る
inject:
  parts: [handoff, log_tail, mine, inbox, memory, knowledge]
  limits:
    handoff: [40, 2000]      # [行数, 文字数]
    log_tail: [20, 1200]     # 前のシフトが引き継ぎなしで終わったときの作業ログの末尾
    mine_items: 15
    inbox_messages: 10
    inbox_chars: 400         # 1 通あたり
    total_chars: 9500        # hook 1 本の全体 (Claude Code は hook 1 本あたり 1 万文字まで。検証 C Q1)
    last_report: [30, 1500]  # 前回の日報の 3 節 (inject に last_report を入れた役割だけ)
    charter: [60, 3000]      # 注入の部品 charter の [行数, 文字数] (inject に charter を入れた役割だけ。T-072)
    board_items: 20          # 注入の部品 board (kanban 風) の項目数の上限。超えた分は「…ほか N 件」(T-030)

# memory の棚卸し (design-p1 §3)。役割の memory は roles/<役割>/memory.md (同じ役割の席で共有)
#   候補: 席が `yamato memo "<本文>"` で seats/<席>/memory-inbox.md に溜める (起動時には読まない)
#   案:   `yamato memory curate <ship> [<役割>]` が役割ごとに headless のシフト (claude -p 1 回) を走らせ、
#         roles/<役割>/memory.proposed.md に置く。シフトの役割プロンプトは roles/_memory-curator.md
#   反映: `yamato memory apply <ship> <役割>` (knowledge.md は --knowledge)。誰が打つかはコードは検査しない
memory:
  applier: pm                # 反映を打つ役割 (省略時は hub)。この役割のその日の最初のシフトに memory status が注入される
  curate_every: 7d           # 前回の反映からこの日数が経ったら棚卸しの目安 (memory status に出るだけ。自動では走らない)
  curate_at: 30              # 候補がこの件数に達したら棚卸しの目安
  max_duration: 15m          # 棚卸しのシフト 1 回の上限
  limits:                    # 超える案は memory apply が反映を拒否する。注入もこの上限で切る (手で編集して超えたら警告)
    memory_lines: 80
    memory_chars: 4000       # 文字数 (Claude Code の hook の上限と同じ数え方)。memory + knowledge が注入の hook 1 本 (1 万文字) に収まる数字
    knowledge_lines: 120
    knowledge_chars: 5000

# owner 宛ての send (`yamato send <ship> owner "..."`) の通知経路 (design-p1 §2.4)。
# via に並べた方式すべてに送る (複数可)。どれかが失敗しても他は送り、失敗は events.jsonl (notify_failed) に残る。
#   slack   incoming webhook に POST。URL は slack.webhook_env の環境変数から読む (艦フォルダには書かない)
#   mac     macOS の通知 (osascript)
#   windows Windows の toast (PowerShell)
#   command 下の command を実行する。件名・本文・重要度 (success / waiting / progress / error / info) は
#           stdin の JSON {"title", "message", "level"} と YAMATO_TITLE / YAMATO_MESSAGE / YAMATO_LEVEL で渡る。
#           メールなど上の 3 つ以外はこれで送る
# 省略 (via: []) なら通知しない (inbox にだけ残る)
notify:
  via: []                    # 例: [slack, mac]
  slack:
    webhook_env: YAMATO_SLACK_WEBHOOK
  # command: "terminal-notifier -title \"$YAMATO_TITLE\" -message \"$YAMATO_MESSAGE\""
  decisions: digest          # 人間が decider の判断の通知: digest (日報にまとめる) / each (1 件ずつ)。--urgent は常に即時

# 判断 (yamato decide) の種類と決める人 (design-p1 §1.4)。decider は席の名前か owner (人間)
# decider は判断を開いた時点で決まり、あとでここを変えても開いている判断の decider は変わらない
# 表にない category は default に落ちる。`merge: owner` のような短い書き方もできる (when なし)
# when は役割プロンプトの「いつ判断を開くか」の説明。艦ごとに自由に変えてよい
decisions:
  merge:        { decider: reviewer, when: "PR を main に入れる (reviewer が承認して自分で merge する。設計の根幹に触る PR は owner に上げる)" }
  design:       { decider: planner,  when: "公開 API・データ形式・依存の追加を決める (planner が owner と詰める)" }
  scope_change: { decider: owner,    when: "charter や goal の範囲を変える" }
  default:      { decider: pm }

# 日報 (design-p1 §2)。reports/daily/<日付>.md
#   on_down  yamato down・強制停止のとき、その日の日報がまだ無ければ事実だけの日報 (--facts-only) を作り、
#            まだ送っていなければ notify.via で要約を送る (captain が落ちていても owner に届く安全網)
#   off      安全網で作らない (report daily / report send は道具としていつでも使える)
# captain が終業時に書く流れは roles/pm.md に書く (コードでは強制しない)
report:
  daily: on_down

# git の道具 (yamato worktree / pr) の設定 (design-p1 §8.3)。誰がいつ打つかは roles/*.md に書く
git:
  base: main                 # worktree add の既定の起点 (origin/main) と PR の base
  strategy: squash           # pr merge のやり方: squash / merge / rebase
  merge_requires: [review, ci, decision]   # pr merge の前に確かめること。[] で確かめない
    # review:   項目に review=approved がある
    # ci:       gh pr checks が通っている (チェックの無い repo は通ったとみなす)
    # decision: 項目を links に持つ merge の判断 (kind: decision, category: merge) が閉じている
  conflict: author           # merge のあとに衝突した PR を知らせる先: author (項目の assignee) / 席の名前

board:
  archive_on_done: true      # done になった項目を board/archive/ に移す (false なら `board archive` で手で移す)
  kinds: [task]              # 最初の値が board add の既定。ほかの値も自由に使える
  fields: [branch, worktree, pr, reviewer, review, merged_by]   # 目安 (board は固定項目以外を検証しない)
