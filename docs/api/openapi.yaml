openapi: 3.1.0
info:
  title: yamato web console API
  version: 1.0.0
  description: |
    yamato web console (決定 2026-10-17) の JSON API。この YAML が正本で、フロントの TS の型はここから生成し、
    Python 側の応答は tests/api_schema.py の検査器でこのスキーマに照らして確かめる。
    M1 は読むだけ (GET)。書き込みと操作 (POST /api/v1/edit/*・/api/v1/ops/*) は dashboard --edit で起動したときだけ受け、付けなければ 501。127.0.0.1 だけで待ち受ける。日時は epoch 秒 (number)、無い・取れない値は null。
    エラーは全 path 共通で components.schemas.Error の形 (HTTP status は 4xx / 5xx)。
    検査器が解く範囲: type (配列で "null" も可)・nullable・properties・required・additionalProperties・items・enum・const・$ref (#/components/schemas/…)。
    それ以外のキーワード (oneOf・allOf など) は使わない。
servers:
  - url: http://127.0.0.1:8765
paths:
  /api/v1/overview:
    get:
      operationId: getOverview
      summary: 全艦の一覧 (今の dashboard の gather 相当)
      description: 判断待ち・艦ごとの席の表・board・PR・異常・2 段目 (日報・孤児・memory・文脈量)。1 艦の読み取りが落ちてもその艦の error に入れて他は返す。
      responses:
        "200":
          description: 全艦の状況
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Overview"}
        default: {$ref: "#/components/responses/Error"}
  /api/v1/fleet:
    get:
      operationId: getFleet
      summary: 艦の一覧 (ships.json と _admiral)
      description: ships.json の艦 (フォルダが消えていても exists=false で出す) と $YAMATO_HOME 直下の艦。_admiral は別枠 (admiral) に出す (一覧の ships には入れない)。読むだけ。
      responses:
        "200":
          description: 艦の一覧
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fleet"}
        default: {$ref: "#/components/responses/Error"}
  /api/v1/ships/{name}/config:
    get:
      operationId: getShipConfig
      summary: 艦の team.yaml を項目ごとに
      description: 艦は fleet の ships のうち exists=true のもの (ships.json の艦と $YAMATO_HOME 直下の艦。files・edit と同じ引き方)。無ければ 404。team.yaml の値・team.schema.json の description・生の yaml・この艦で読める md の一覧・「次の up で効く変更あり」。
      parameters:
        - {$ref: "#/components/parameters/ShipName"}
      responses:
        "200":
          description: 艦の設定
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ShipConfig"}
        default: {$ref: "#/components/responses/Error"}
  /api/v1/ships/{name}/files/{file}:
    get:
      operationId: getShipFile
      summary: roles/*.md・charter.md・knowledge.md の中身
      description: 艦は fleet の ships のうち exists=true のもの (config・edit と同じ引き方)。無ければ 404。file は艦フォルダからの相対 path を URL エンコードした 1 語 (roles%2Fimpl.md・charter.md・knowledge.md)。ShipConfig.files に出たものだけ読める。それ以外は 404。
      parameters:
        - {$ref: "#/components/parameters/ShipName"}
        - name: file
          in: path
          required: true
          description: ShipConfig.files[].file の値 (URL エンコード)。
          schema: {type: string}
      responses:
        "200":
          description: ファイルの中身
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ShipFile"}
        default: {$ref: "#/components/responses/Error"}
  /api/v1/ships/{name}/items/{id}:
    get:
      operationId: getShipItem
      summary: board の項目 1 件 (判断も task も同じ形)
      description: 艦は fleet の ships のうち exists=true のもの (config・files と同じ引き方)。id は [A-Z]-[0-9]+ の形だけ受け (path に使う前に検査)、board/items と board/archive から引く。艦が無い・項目が無い・id の形が違うときは 404。読むだけで何も書かない。
      parameters:
        - {$ref: "#/components/parameters/ShipName"}
        - name: id
          in: path
          required: true
          description: 項目の id (D-001・T-001 の形)。
          schema: {type: string, pattern: "^[A-Z]-[0-9]+$"}
      responses:
        "200":
          description: 項目
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ShipItem"}
        default: {$ref: "#/components/responses/Error"}
  /api/v1/edit/preview:
    post:
      operationId: previewEdit
      summary: 書き込みの 1 段目 (検証して差分を返す。何も書かない)
      description: |
        --edit のときだけ。要求ヘッダに X-Yamato-Token (起動ごとの乱数。index.html の
        <meta name="yamato-token"> に埋まる)・Host は 127.0.0.1:<port>・Origin は http://127.0.0.1:<port>・
        Content-Type は application/json が要る。どれかが違えば 403 (forbidden)。--edit が無ければ 501。
        書き換えられるファイルは (ship, file) で決まり、書ける対象でなければ 404。今書けるのは team.yaml と、ShipConfig.files のうち kind が role・charter のもの (knowledge は memory apply の記録のため読むだけ)。空の中身は valid=false。team.yaml の errors は、yaml の構文エラーと、項目を指せる検証エラーの頭に「行 N:」(1 始まり) が付く。新しい中身は content (全文) か ops (部分置き換えの操作。team.yaml だけ) のどちらか 1 つで送る。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EditRequest"}
      responses:
        "200":
          description: 検証の結果と差分。base_hash を commit に渡す。
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EditPreview"}
        default: {$ref: "#/components/responses/Error"}
  /api/v1/edit/commit:
    post:
      operationId: commitEdit
      summary: 書き込みの 2 段目 (preview のときと同じ内容なら書く)
      description: |
        preview と同じ検査ヘッダが要る。検証をやり直し、通らなければ 422 (invalid)。今のファイルのハッシュが
        base_hash と違えば 409 (conflict) で何も書かない。書くときは上書き前の版を <艦>/.runtime/edit-backup/ に
        1 世代残し、一時ファイル + rename で置き換える。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EditCommitRequest"}
      responses:
        "200":
          description: 書いた。
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EditCommit"}
        default: {$ref: "#/components/responses/Error"}
  /api/v1/ops/{op}:
    post:
      operationId: runOp
      summary: 操作 (yamato の CLI を 1 回呼んで、出力と exit code を返す)
      description: |
        --edit のときだけ。preview と同じ検査ヘッダ (X-Yamato-Token・Host・Origin・Content-Type) が要る。
        操作は yamato の CLI を別プロセスで呼ぶだけで、操作のロジックは持たない (引数は list・shell なし・
        30 秒待ったら返す・stdout と stderr をまとめて返す)。CLI が失敗しても (exit_code が 0 でなくても)
        応答は 200 で、画面は出力と exit code をそのまま見せる。op は OpName の値。知らない op は 404。
        確認が要る操作は、画面の確認を経た印 confirmed=true が無ければ実行せず 400 (bad_request)。
        今ある操作は rotate (止まっている persistent の席に入れ替えの印を立てる。生きている席は CLI が断る)・
        艦の up (params: for・seats は省ける)・down・down-force (down --force)・extend (params.span)・halt、
        席への send (params: seat・message。送り手は owner)・判断を閉じる decide-close (params: id・choice・reason。決めた人は owner)。
        艦の操作は yamato up / down / extend / halt / send / decide close をそのまま呼ぶ (席や admiral の名前は借りない)。CLI が断れば exit_code と output にそのまま出る。
        CLI は画面と別のセッションで起こし、30 秒待っても終わらなければ殺さずに timed_out で返す (裏で最後まで走る。
        up や halt を途中で殺すと半端な状態が残るため)。出力は艦の .runtime/web-ops/ のファイルに書かれる。
      parameters:
        - name: op
          in: path
          required: true
          description: 操作の名前 (rotate・up・down・down-force・extend・halt・send・decide-close)。
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OpRequest"}
      responses:
        "200":
          description: CLI を呼んだ結果。
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OpResult"}
        default: {$ref: "#/components/responses/Error"}
components:
  parameters:
    ShipName:
      name: name
      in: path
      required: true
      description: 艦の名前 (fleet の ships[].name)。
      schema: {type: string}
  responses:
    Error:
      description: エラー (4xx / 5xx)。形は全 path 共通。
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    Error:
      type: object
      description: 共通のエラー。code は機械が分岐に使う短い語、message は人が読む日本語。
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: not_found (艦・ファイルが無い) / bad_request / unreadable (読めない・壊れている) / internal / forbidden (書き込みのトークン・Host・Origin が合わない) / conflict (preview のあとにファイルが変わった) / invalid (検証に通らない) / unpatchable (その yaml の形には部分置き換えで当てられない。生の yaml で直す)。
              enum: [not_found, bad_request, unreadable, internal, forbidden, conflict, invalid, unpatchable]
            message: {type: string}
            detail:
              type: [string, "null"]
              description: 例外名など補足。無ければ null または省略。
      additionalProperties: false
    EditRequest:
      type: object
      required: [ship, file]
      properties:
        ship: {type: string, description: "艦の名前。"}
        file: {type: string, description: "書き換える対象 (艦フォルダからの相対 path)。"}
        content: {type: string, description: "新しい中身の全文。ops とどちらか 1 つ。"}
        ops:
          type: array
          description: 今の中身に当てる操作の列 (team.yaml だけ。コメントと並びを保つ部分置き換え)。content とどちらか 1 つ。当てられない形は 422 (unpatchable)。
          items: {$ref: "#/components/schemas/EditOp"}
      additionalProperties: false
    EditOp:
      type: object
      description: |
        yaml の部分置き換え 1 つ。op と path は必須。path は map のキー (文字列) と list の添字 (整数) の並び。
        set_value (scalar の値を value に) / add_key (path の map に key: value を足す) / remove_key (path のキーを消す) /
        insert_item (path の list に value を足す。index 無しで末尾) / remove_item (path の要素を消す)。
      required: [op, path]
      properties:
        op: {type: string, enum: [set_value, add_key, remove_key, insert_item, remove_item]}
        path:
          type: array
          items: {type: [string, integer]}
        key: {type: string, description: "add_key のキー名。"}
        value: {description: "set_value・add_key・insert_item の値 (JSON)。"}
        index: {type: integer, description: "insert_item の位置。"}
      additionalProperties: false
    EditCommitRequest:
      type: object
      required: [ship, file, base_hash]
      properties:
        ship: {type: string}
        file: {type: string}
        content: {type: string, description: "新しい中身の全文。ops とどちらか 1 つ。"}
        ops:
          type: array
          items: {$ref: "#/components/schemas/EditOp"}
        base_hash: {type: string, description: "preview が返した base_hash。"}
      additionalProperties: false
    EditPreview:
      type: object
      required: [valid, errors, changed, diff, base_hash]
      properties:
        valid: {type: boolean, description: 検証に通ったか。false なら commit は 422。}
        errors:
          type: array
          items: {type: string}
        changed: {type: boolean, description: 今の中身と違うか。}
        diff: {type: string, description: 今の中身から新しい中身への unified diff。}
        base_hash: {type: string, description: "今のファイルの sha256 (16 進)。ファイルが無ければ - 1 文字。"}
      additionalProperties: false
    EditCommit:
      type: object
      required: [written, hash]
      properties:
        written: {type: boolean}
        hash: {type: string, description: 書いたあとのファイルの sha256 (16 進)。}
      additionalProperties: false
    OpRequest:
      type: object
      required: [ship, params, confirmed]
      properties:
        ship: {type: string, description: "艦の名前 (fleet の ships[].name)。"}
        params:
          type: object
          description: 操作ごとの引数 (rotate は seat に席の名前、up は for・seats、extend は span、send は seat・message、decide-close は id・choice・reason)。値は文字列だけ。
          additionalProperties: {type: string}
        confirmed: {type: boolean, description: "画面で確認を経たか。確認が要る操作は true でなければ実行しない。"}
      additionalProperties: false
    OpResult:
      type: object
      required: [argv, exit_code, timed_out, output, truncated, log]
      properties:
        argv:
          type: array
          description: 呼んだ CLI (先頭は yamato)。表示用で、実行は python で本体を直接呼ぶ。
          items: {type: string}
        exit_code: {type: [integer, "null"], description: "CLI の exit code。タイムアウトで打ち切ったときは null。"}
        timed_out: {type: boolean, description: "30 秒待っても終わらなかった。CLI は殺さず裏で最後まで走る (結果は log のファイルか status で見る)。"}
        output: {type: string, description: "stdout と stderr をまとめた出力。端末の制御文字は落としてある。"}
        truncated: {type: boolean, description: "長すぎて後ろを切ったか。"}
        log: {type: string, description: "出力を書いているファイル (艦の .runtime/web-ops/ の下)。timed_out のときは CLI が終わるまで伸びる。"}
      additionalProperties: false
    Overview:
      type: object
      required: [generated_at, agents_error, waits, ships]
      properties:
        generated_at: {type: number, description: "組み立てた時刻 (epoch 秒)。"}
        agents_error:
          type: [string, "null"]
          description: claude agents --json を読めなかったときの理由 (生存が不明になる)。読めたら null。
        waits:
          type: array
          description: 全艦の owner の判断待ち (decider が人間の open な判断)。急ぎ→id 順。
          items: {$ref: "#/components/schemas/Wait"}
        ships:
          type: array
          items: {$ref: "#/components/schemas/ShipOverview"}
    Wait:
      type: object
      required: [ship, id, title, urgent, age, recommendation]
      properties:
        ship: {type: string}
        id: {type: string}
        title: {type: string}
        urgent: {type: boolean}
        age: {type: string, description: "経過の表示 (例: 2h13m)。取れなければ空文字。"}
        recommendation: {type: [string, "null"], description: "判断の本文にある「推し」。無ければ null。"}
    ShipOverview:
      type: object
      description: 1 艦。読めなければ error に理由が入り state は null。
      required: [name, error, state]
      properties:
        name: {type: string}
        error: {type: [string, "null"]}
        state:
          type: [object, "null"]
          required: [team, deadline, hub, hub_last, tokens, owner_unread, multi_repo, counts, seats, board, prs, anomalies, report, orphans, memory]
          properties:
            team: {type: string, description: "team.yaml の name。"}
            deadline: {type: string, description: "稼働時間の上限の表示 (例: deadline 10-17 17:23 (残り 1h54m))。"}
            hub: {type: string, description: "captain の席。"}
            hub_last: {type: [number, "null"], description: "captain の最終活動 (epoch 秒)。"}
            tokens: {type: integer, description: "今日の全席のトークン合計。"}
            owner_unread: {type: integer, description: "owner 宛て inbox の未読数。"}
            multi_repo: {type: boolean, description: "workspace が複数 repo か。"}
            counts:
              type: object
              description: board の state ごとの件数 (decision は除く)。
              additionalProperties: {type: integer}
            seats:
              type: array
              items: {$ref: "#/components/schemas/Seat"}
            board:
              type: array
              description: active / blocked の項目 (decision は除く)。
              items: {$ref: "#/components/schemas/BoardItem"}
            prs:
              type: array
              description: board の pr 欄がある done 以外。
              items: {$ref: "#/components/schemas/Pr"}
            anomalies:
              type: array
              description: 直近 3 日の異常 (feed.ABNORMAL_KINDS)。新しい順。
              items: {$ref: "#/components/schemas/Anomaly"}
            report:
              type: [object, "null"]
              description: 前回の日報。まだ無ければ null。
              required: [date, word, tomorrow]
              properties:
                date: {type: string}
                word: {type: string}
                tomorrow: {type: string}
            orphans:
              type: array
              description: 担当の席が落ちて active のまま残った項目。
              items:
                type: object
                required: [id, title, seat, why]
                properties:
                  id: {type: string}
                  title: {type: string}
                  seat: {type: [string, "null"]}
                  why: {type: string}
            memory:
              type: array
              description: memory の候補数と前回の反映からの日数。
              items:
                type: object
                required: [role, count, days, due]
                properties:
                  role: {type: [string, "null"], description: "役割名。艦全体の knowledge は null。"}
                  count: {type: integer}
                  days: {type: [integer, "null"], description: "前回の反映からの日数。反映が無ければ null。"}
                  due: {type: boolean, description: "棚卸しの目安に達したか。"}
    Seat:
      type: object
      required: [name, role, shift, alive, pid, status, waiting_for, last, active, reviewing, unread, flags, log, tokens, budget, last_cost, context]
      properties:
        name: {type: string}
        role: {type: [string, "null"]}
        shift: {type: string, description: "per_task / continuous / headless など。"}
        alive: {type: boolean}
        pid: {type: [integer, "null"]}
        status: {type: [string, "null"], description: "claude agents の status。"}
        waiting_for: {type: [string, "null"]}
        last: {type: [number, "null"], description: "最終活動 (epoch 秒)。"}
        active:
          type: array
          description: 担当で active の項目 id。
          items: {type: string}
        reviewing:
          type: array
          description: レビュー中の項目 id。
          items: {type: string}
        unread: {type: integer}
        flags:
          type: array
          description: 要対応 (admiral.red_flags)。
          items:
            type: object
            required: [level, text, detail]
            properties:
              level: {type: string, enum: [red, warn]}
              text: {type: string}
              detail: {type: string}
        log: {type: string, description: "使用量の行 (「使用量 」で始まる本文) を飛ばした最後の作業の行。無ければ空文字。"}
        tokens: {type: integer, description: "今日のトークン。"}
        budget: {type: [number, "null"], description: "headless の席だけ。役割の max_budget_usd。"}
        last_cost: {type: [number, "null"], description: "headless の席の前回の total_cost_usd。"}
        context:
          type: [object, "null"]
          description: 文脈量。取れなければ null。
          required: [tokens, limit]
          properties:
            tokens: {type: integer}
            limit: {type: [integer, "null"], description: "rotate の閾値。無ければ null。"}
    BoardItem:
      type: object
      required: [id, title, state, assignee, blocked_on]
      properties:
        id: {type: string}
        title: {type: string}
        state: {type: string}
        assignee: {type: [string, "null"]}
        blocked_on:
          type: array
          items: {type: string}
    Pr:
      type: object
      required: [item, title, state, repo, number, link]
      properties:
        item: {type: string}
        title: {type: string}
        state: {type: string}
        repo: {type: string}
        number: {type: string, description: "PR 番号 (# なし)。"}
        link: {type: [string, "null"], description: "workspace の origin が GitHub のときの URL。"}
    Anomaly:
      type: object
      required: [kind, ts, summary]
      properties:
        kind: {type: string}
        ts: {type: number}
        summary: {type: string}
    Fleet:
      type: object
      required: [home, ships, admiral]
      properties:
        home: {type: string, description: "$YAMATO_HOME。"}
        ships:
          type: array
          items: {$ref: "#/components/schemas/FleetShip"}
        admiral:
          type: [object, "null"]
          description: _admiral。フォルダが無ければ null。
          required: [path, team, roles, error]
          properties:
            path: {type: string}
            team: {type: [string, "null"], description: "team.yaml の name。読めなければ null。"}
            roles:
              type: array
              description: team.yaml の roles の名前 (読めなければ空)。
              items: {type: string}
            error: {type: [string, "null"], description: "team.yaml を読めなかった理由。"}
    FleetShip:
      type: object
      required: [name, path, registered, exists, team, error]
      properties:
        name: {type: string}
        path: {type: string}
        registered: {type: boolean, description: "ships.json にあるか (false は $YAMATO_HOME 直下の拾い上げ)。"}
        exists: {type: boolean, description: "path に team.yaml があるか (ships.json にあってフォルダが消えた艦は false)。"}
        team: {type: [string, "null"]}
        error: {type: [string, "null"], description: "team.yaml を読めなかった理由。"}
    ShipConfig:
      type: object
      required: [name, path, fields, raw, files, pending]
      properties:
        name: {type: string}
        path: {type: string, description: "team.yaml の絶対 path。"}
        fields:
          type: array
          description: team.yaml の最上位の項目を team.schema.json の並びで。schema にあるが team.yaml に無い項目も set=false で出す。
          items: {$ref: "#/components/schemas/ConfigField"}
        raw: {type: string, description: "team.yaml の生のテキスト (コメント込み)。"}
        files:
          type: array
          description: この艦で読める md。
          items:
            type: object
            required: [file, kind, bytes]
            properties:
              file: {type: string, description: "艦フォルダからの相対 path (roles/impl.md)。files/{file} には URL エンコードして渡す。"}
              kind: {type: string, enum: [role, charter, knowledge]}
              bytes: {type: integer}
        pending:
          type: object
          description: 「次の up で効く変更あり」(team.yaml と .runtime/team.json の差)。
          required: [changed, keys]
          properties:
            changed: {type: boolean}
            keys:
              type: array
              description: 差のある最上位の項目名。
              items: {type: string}
    ConfigField:
      type: object
      required: [key, set, required, value, type, description, enum, schema]
      properties:
        key: {type: string, description: "最上位の項目名。"}
        set: {type: boolean, description: "team.yaml に書かれているか。"}
        required: {type: boolean}
        value: {description: "team.yaml の値 (JSON にした形)。未設定は null。"}
        type: {type: [string, "null"], description: "schema の type (複数なら | で連結)。anyOf だけなら null。"}
        description: {type: [string, "null"]}
        enum:
          type: [array, "null"]
          description: schema の enum。無ければ null。
          items: {}
        schema:
          type: [object, "null"]
          description: この項目の team.schema.json の定義そのもの (type・enum・properties・anyOf・description など)。フォームはこれから組む。schema に無い項目は null。
          additionalProperties: true
    ShipItem:
      type: object
      required: [id, kind, title, state, category, urgent, assignee, blocked_on, links, body]
      properties:
        id: {type: string}
        kind: {type: [string, "null"]}
        title: {type: string}
        state: {type: [string, "null"]}
        category: {type: [string, "null"], description: "判断 (kind=decision) だけ。他は null。"}
        urgent: {type: [boolean, "null"], description: "判断だけ。他は null。"}
        assignee: {type: [string, "null"]}
        blocked_on: {type: array, items: {type: string}}
        links: {type: array, items: {type: string}}
        body: {type: string, description: "本文の markdown (frontmatter を除いた生の文字列)。"}
    ShipFile:
      type: object
      required: [name, file, kind, text, bytes]
      properties:
        name: {type: string}
        file: {type: string}
        kind: {type: string, enum: [role, charter, knowledge]}
        text: {type: string}
        bytes: {type: integer}
